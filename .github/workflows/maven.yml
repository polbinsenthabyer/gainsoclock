# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: ${{ secrets.DATABASE_NAME}}
          MARIADB_ROOT_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATASOURCE_URL: ${{ secrets.DATASOURCE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: bash ./mvnw -B clean verify

      - name: Save JAR for deployment
        uses: actions/upload-artifact@v7
        with:
          name: gainsoclock-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, gainsoclock-deploy]
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v8
        with:
          name: gainsoclock-jar
          path: ${{ runner.temp }}/gainsoclock-release

      - name: Get deployment script
        uses: actions/checkout@v7

      - name: Install, restart, and check health
        run: bash scripts/deploy.sh "${RUNNER_TEMP}/gainsoclock-release"
